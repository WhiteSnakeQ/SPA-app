<div class="comment">

    <div class="comment-header">

        <span class="clickable"	(click)="sort.emit(CommentSorting.USER_NAME)">

		{{ comment.userName }}

		</span>

		<span class="clickable"	(click)="sort.emit(CommentSorting.EMAIL)">
            {{ comment.email }}
        </span>

        <span class="clickable"	(click)="sort.emit(CommentSorting.CREATED_AT)">
            {{ comment.createdAt | date:'dd.MM.yyyy HH:mm' }}
        </span>

		<button class="reply-button" (click)="openReply()">
			Reply
		</button>	
    </div>

    <div class="comment-body" [innerHTML]="comment.text">
    </div>

	<div class="comment-files" *ngIf="comment.files?.length">
		<div class="comment-files">
			<div
				*ngFor="let file of comment.files"
				class="file-item">
				<a
					*ngIf="isImage(file)"
					[href]="file.fileUrl"
					data-lightbox="comment-files">

					<img
						[src]="file.fileUrl"
						class="comment-image">

				</a>
				
				<a
					*ngIf="!isImage(file)"
					[href]="file.fileUrl"
					target="_blank">

					{{ file.fileName }}

				</a>
			</div>
		</div>
	</div>
	<button *ngIf="comment.replyCount > 0" class="reply-button" (click)="showChildrens()"> 
		{{ showChildren
        ? 'Hide replies'
        : 'Show replies (' + comment.replyCount + ')' }}
	</button>

			

	<app-comment-form *ngIf="showReplyForm" [parentId]="comment.id" [rootId]="comment.rootId" (created)="closeForm($event)" (closed)="showReplyForm = false" (fileSelecting)="fileSelecting.emit($event)">
	</app-comment-form>

    <div class="children" *ngIf="comment.children?.length && showChildren">
        <app-comment-item *ngFor="let child of comment.children" [comment]="child" (sort)="sort.emit($event)" (reply)="openReply()">
        </app-comment-item>
    </div>

</div>
