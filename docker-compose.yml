services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04

    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"

    container_name: comments-db

    restart: unless-stopped

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  redis:
    image: redis:7-alpine

    container_name: redis_cache

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    ports:
      - "6379:6379"

    restart: unless-stopped

  app:
    build:
      context: .

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/src/backend
      - upload_data:/app/wwwroot/uploads

    command: dotnet SPA-app.dll

    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

  ngrok:
    image: ngrok/ngrok:3

    depends_on:
      - app

    command:
      - "http"
      - "--url=tabby-spiffy-blinks.ngrok-free.dev"
      - "app:8080"

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    ports:
      - "4040:4040"

volumes:
  sql_data:
  upload_data:
